<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product, AI & GTM Resume</title>
  <style>
    :root {
      --bg: #070b16;
      --panel: rgba(255, 255, 255, 0.075);
      --panel-strong: rgba(255, 255, 255, 0.11);
      --text: #f4f7fb;
      --muted: #a8b3c7;
      --accent: #65f4d5;
      --accent-2: #7aa7ff;
      --accent-3: #ffcc70;
      --line: rgba(255, 255, 255, 0.15);
      --shadow: rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(101, 244, 213, 0.2), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(122, 167, 255, 0.24), transparent 32%),
        radial-gradient(circle at 50% 95%, rgba(255, 204, 112, 0.11), transparent 26%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 34px;
    }

    .resume-shell {
      max-width: 1180px;
      margin: 0 auto;
      position: relative;
    }

    .resume-shell::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 82%);
      pointer-events: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      backdrop-filter: blur(16px);
    }

    .badge span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--text);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      font-weight: 650;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(101, 244, 213, 0.55);
      box-shadow: 0 10px 24px rgba(0,0,0,0.24);
    }

    .hero {
      position: relative;
      z-index: 1;
      border: 1px solid var(--line);
      border-radius: 32px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.045));
      box-shadow: 0 24px 80px var(--shadow);
      backdrop-filter: blur(22px);
      margin-bottom: 20px;
    }

    .hero-inner {
      display: grid;
      grid-template-columns: 1.45fr 0.75fr;
      gap: 28px;
      padding: 38px;
    }

    .kicker {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 0.92;
      letter-spacing: -0.065em;
      margin-bottom: 18px;
    }

    .headline {
      max-width: 820px;
      color: #dbe4f3;
      font-size: 19px;
      margin-bottom: 22px;
    }

    .headline strong {
      color: #ffffff;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #eaf1fb;
      font-size: 13px;
    }

    .contact-card {
      padding: 24px;
      border-radius: 26px;
      background: rgba(7, 11, 22, 0.45);
      border: 1px solid var(--line);
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .contact-card h2 {
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .contact-item {
      color: var(--muted);
      font-size: 14px;
      margin-top: 9px;
    }

    .signal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding: 0 38px 38px;
    }

    .signal {
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 17px;
      background: rgba(255,255,255,0.06);
    }

    .signal .num {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
    }

    .signal p {
      color: var(--muted);
      font-size: 13px;
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 0.9fr 1.55fr;
      gap: 20px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.18);
    }
