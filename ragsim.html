<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Simulator - Interactive Learning</title>
  <style>
    :root {
      --bg: #f6faf8;
      --card: #ffffff;
      --text: #13261f;
      --muted: #64756e;
      --soft: #eef7f2;
      --green: #16885a;
      --green-dark: #0f6d47;
      --green-light: #dff3e9;
      --blue: #2f6fed;
      --amber: #b7791f;
      --red: #c2410c;
      --border: #dbe7e1;
      --shadow: 0 18px 50px rgba(16, 66, 45, 0.10);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(22, 136, 90, 0.10), transparent 28%),
        radial-gradient(circle at 95% 12%, rgba(47, 111, 237, 0.08), transparent 26%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 28px;
    }

    .app {
      max-width: 1240px;
      margin: 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 20px;
      align-items: stretch;
      margin-bottom: 20px;
    }

    .hero-card,
    .side-card,
    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-card {
      padding: 34px;
      overflow: hidden;
      position: relative;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: rgba(22, 136, 90, 0.08);
      right: -70px;
      top: -80px;
    }

    .eyebrow {
      color: var(--green);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(36px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.055em;
      margin-bottom: 16px;
      max-width: 820px;
    }

    .hero-card p {
      color: var(--muted);
      font-size: 18px;
      max-width: 820px;
      margin-bottom: 22px;
    }

    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--soft);
      color: var(--green-dark);
      border: 1px solid var(--green-light);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .side-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .metric {
      padding: 16px;
      background: var(--soft);
      border-radius: 18px;
      border: 1px solid var(--green-light);
    }

    .metric strong {
      display: block;
      font-size: 26px;
      color: var(--green-dark);
      margin-bottom: 3px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 0.78fr 1.22fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      padding: 24px;
      margin-bottom: 20px;
    }

    .panel h2 {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: var(--green);
      margin-bottom: 14px;
    }

    .panel h3 {
      font-size: 20px;
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }

    .panel p,
    .panel li {
      color: var(--muted);
      font-size: 14.5px;
    }

    ul {
      display: grid;
      gap: 8px;
      list-style: none;
    }

    li {
      position: relative;
      padding-left: 18px;
    }

    li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .diagram-wrap {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .diagram {
      min-width: 760px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      align-items: stretch;
      position: relative;
    }

    .node {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 18px;
      padding: 15px;
      min-height: 126px;
      position: relative;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .node:hover,
    .node.active {
      transform: translateY(-2px);
      border-color: rgba(22, 136, 90, 0.45);
      box-shadow: 0 12px 26px rgba(22, 136, 90, 0.12);
      background: #fafffc;
    }

    .node-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--green);
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .node h4 {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .node p {
      font-size: 12.5px;
      color: var(--muted);
    }

    .arrow {
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 2px;
      background: var(--green-light);
      z-index: 2;
    }

    .arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: -5px;
      border-left: 8px solid var(--green-light);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    .simulator {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .query-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 15px;
      font-size: 15px;
      outline: none;
      color: var(--text);
      background: #ffffff;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(22, 136, 90, 0.10);
    }

    button {
      border: none;
      border-radius: 16px;
      background: var(--green);
      color: #ffffff;
      padding: 14px 18px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }

    .output-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .output-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      background: #ffffff;
    }

    .output-card strong {
      display: block;
      color: var(--green-dark);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .output-card p {
      font-size: 13.5px;
      color: var(--muted);
    }

    .doc-list {
      display: grid;
      gap: 10px;
    }

    .doc {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      background: #ffffff;
    }

    .doc-score {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--soft);
      color: var(--green-dark);
      font-weight: 900;
      font-size: 13px;
    }

    .doc-title {
      font-weight: 800;
      color: var(--text);
      font-size: 14px;
    }

    .doc-text {
      color: var(--muted);
      font-size: 12.5px;
